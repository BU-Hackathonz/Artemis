# Secret scanning config (CI job "secrets" in .github/workflows/ci.yml).
# Keep the allowlist this narrow: only the fake values the tests need.
[extend]
useDefault = true

[[allowlists]]
description = "Fake API key used as test input"
regexes = ['''sk-ant-api03-FAKE[A-Za-z0-9_-]*''']

[[allowlists]]
description = "PEM header strings that are redaction test input, not keys"
targetRules = ["private-key"]
condition = "AND"
paths = ['''server/artemis/policy/test_redact\.py''']
regexTarget = "line"
regexes = ['''PRIVATE KEY-----\\nMIIEow''']

[[allowlists]]
description = "Windows Credential Manager target names in the launcher (infra/credstore.ps1), not secrets"
targetRules = ["generic-api-key"]
regexes = ['''^Artemis/Anthropic(ApiKey|WorkspaceId)$''']

[[allowlists]]
description = "Superseded branch infra/ubuntu-launcher (replaced by infra/ubuntu-launch, #142): its start.sh initialised an empty TOKEN, which generic-api-key reads as a key. No secret; the CI scan reads every branch."
targetRules = ["generic-api-key"]
commits = ["78279e2471b0de23dadbb823240f376ac5f61664"]

[[allowlists]]
description = "The press_keys tool's name in the policy table (#176) reads to generic-api-key as a key. No secret; the CI scan reads every branch."
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''^\s*"press_keys":\s*Rule\(PressKeysArgs''']
