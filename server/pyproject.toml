[project]
name = "artemis"
version = "0.1.0"
description = "Artemis headless core: voice-first development environment for blind developers"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "sse-starlette",
]

[dependency-groups]
# Voice (Yaovi): mic capture, local speech-to-text, SAPI fallback speech.
voice = [
    "faster-whisper",
    "sounddevice",
    "pywin32; sys_platform == 'win32'",
]
# Agent (David): the Claude tool loop.
agent = [
    "anthropic>=2.8",
]
# Security (David): the static scan before every write and run approval.
security = [
    "bandit>=1.9",
]
# Echo Check (Avery + Jun): Playwright for the accessibility tree; axe-core is vendored.
echo = [
    "playwright>=1.48",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["artemis"]

[tool.pytest.ini_options]
testpaths = ["artemis"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
