[project]
name = "artemis"
version = "0.1.0"
description = "Artemis headless core: voice-first development environment for blind developers"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "sse-starlette",
]

[dependency-groups]
# Voice (Yaovi): mic capture, local speech-to-text, SAPI fallback speech.
voice = [
    "faster-whisper",
    "sounddevice",
    "pywin32; sys_platform == 'win32'",
]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["artemis"]

[tool.pytest.ini_options]
testpaths = ["artemis"]
