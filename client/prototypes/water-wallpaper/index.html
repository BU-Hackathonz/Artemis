<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Water wallpaper</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; cursor: default; }
  canvas#water { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  body { font: 13px/1.4 "Segoe UI", system-ui, sans-serif; color: #fff; }
  #panel {
    position: fixed; left: 24px; bottom: 24px; width: 280px; padding: 14px 16px 12px;
    border-radius: 14px; background: rgb(20 20 24 / 0.72); backdrop-filter: blur(16px);
    box-shadow: 0 8px 30px rgb(0 0 0 / 0.35); user-select: none;
  }
  #panel h1 { margin: 0 0 10px; font-size: 13px; font-weight: 600; letter-spacing: .02em; }
  #panel label { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin-bottom: 10px; }
  #panel input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: #7cc4ff; }
  #panel output { font-variant-numeric: tabular-nums; opacity: .8; }
  #panel .row { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
  #panel button { font: inherit; color: #fff; background: rgb(255 255 255 / 0.12); border: 1px solid rgb(255 255 255 / 0.25);
    border-radius: 999px; padding: 4px 12px; }
  #panel button:hover { background: rgb(255 255 255 / 0.2); }
  #panel .keys { margin-left: auto; opacity: .6; font-size: 12px; }
  #hint { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); padding: 6px 12px; border-radius: 999px;
    background: rgb(20 20 24 / 0.6); font-size: 12px; pointer-events: none; }
  #pick, #fatal { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; background: #111; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid #7cc4ff; outline-offset: 2px; }
</style>
<!-- Written by the launcher next to this file: window.WALLPAPER = { src, style, bg } -->
<script src="wallpaper.js"></script>
</head>
<body>
<canvas id="water" aria-hidden="true"></canvas>

<section id="panel" aria-label="Water controls">
  <h1>Water wallpaper</h1>
  <label>Wake width <output id="wake-v"></output>
    <input id="wake" type="range" min="20" max="200" step="1"></label>
  <label>Distortion strength <output id="distortion-v"></output>
    <input id="distortion" type="range" min="0" max="3" step="0.05"></label>
  <label>Damping <output id="damping-v"></output>
    <input id="damping" type="range" min="1" max="30" step="1"></label>
  <label>Active radius <output id="radius-v"></output>
    <input id="radius" type="range" min="80" max="600" step="10"></label>
  <div class="row">
    <button id="hide" type="button">Hide controls</button>
    <button id="reset" type="button">Reset</button>
    <span class="keys">H · Esc</span>
  </div>
</section>

<div id="hint" hidden role="status">Press H to show controls · Esc to exit</div>

<div id="pick" hidden>
  <div>
    <p>No wallpaper was passed in. Choose or drop an image to try the water on.</p>
    <input id="file" type="file" accept="image/*">
  </div>
</div>
<div id="fatal" hidden><p>This preview needs WebGL2 with float render targets (current Edge or Chrome).</p></div>

<!--APP-->
</body>
</html>
